{% extends "base.html" %}
{% block title %}Sign in · Bohol House{% endblock %}

{% block content %}
  <article class="auth-card">
    <hgroup>
      <h2>Welcome back</h2>
      <p>Sign in to your Bohol House profile</p>
    </hgroup>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label>Username
        <input name="username" autocomplete="username" autocapitalize="none"
               value="{{ request.form.get('username', '') }}" required autofocus>
      </label>

      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>

      <label>
        <input type="checkbox" name="remember" role="switch">
        Keep me signed in for 30 days
      </label>
      <small class="hint">Leave this off on shared or borrowed devices.</small>

      <button type="submit">Sign in</button>
    </form>

    <footer class="auth-links">
      <a href="{{ url_for('auth.recover') }}">Forgot password?</a>
      <a href="{{ url_for('auth.register') }}">Create a profile</a>
    </footer>
  </article>
{% endblock %}
